<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gufo Saggio</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&family=Andika:wght@400;700&family=Playwrite+IT+Moderna&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #F7F1E1;
    --parchment-alt: #EFE4C8;
    --ink: #2C2416;
    --ink-soft: #6B5E48;
    --forest: #2F4B3C;
    --forest-light: #4C7160;
    --gold: #C9950F;
    --dusk: #5B6C9E;
    --red: #A8432D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    background: var(--parchment);
    background-image:
      radial-gradient(circle at 15% 8%, var(--parchment-alt) 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, var(--parchment-alt) 0%, transparent 40%);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 48px;
  }

  main {
    width: 100%;
    max-width: 560px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 36px;
  }

  header .owl { flex-shrink: 0; }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    color: var(--forest);
    line-height: 1.1;
  }

  .tagline {
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .greeting-card {
    background: #fff;
    border: 1px solid var(--parchment-alt);
    border-radius: 20px;
    padding: 28px 26px;
    box-shadow: 0 4px 0 var(--parchment-alt);
    margin-bottom: 40px;
  }

  #greeting-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    color: var(--forest);
    margin: 0 0 6px;
  }

  #greeting-meta {
    font-size: 16px;
    color: var(--ink-soft);
    margin: 0;
  }

  .section-label {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--forest);
    margin: 0 0 16px;
  }

  #materie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }

  .materia-card {
    background: #fff;
    border: 1px solid var(--parchment-alt);
    border-radius: 18px;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    font: inherit;
    cursor: pointer;
    width: 100%;
    text-align: left;
  }

  .materia-card:hover,
  .materia-card:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(47, 75, 60, 0.12);
  }

  .materia-card:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .materia-icona {
    font-size: 34px;
    line-height: 1;
  }

  .materia-nome {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    color: var(--ink);
  }

  .materia-tag {
    font-size: 13px;
    color: var(--dusk);
    font-weight: 700;
  }

  .empty {
    color: var(--ink-soft);
    font-size: 15px;
  }

  #view-argomenti[hidden],
  #view-home[hidden],
  #view-esercizio[hidden],
  #view-lab[hidden] {
    display: none;
  }

  .back-link {
    display: inline-block;
    color: var(--forest);
    font-weight: 700;
    text-decoration: none;
    margin-bottom: 24px;
    font-size: 15px;
    cursor: pointer;
  }

  .back-link:hover { text-decoration: underline; }

  .back-link:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .argomenti-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .argomenti-header-icona { font-size: 32px; }

  .argomenti-header-nome {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    color: var(--forest);
    margin: 0;
  }

  .argomento-card {
    background: #fff;
    border: 1px solid var(--parchment-alt);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
    width: 100%;
    text-align: left;
    font: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .argomento-card:hover,
  .argomento-card:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(47, 75, 60, 0.1);
  }

  .argomento-card:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .argomento-card:disabled {
    cursor: default;
    opacity: 0.6;
  }

  .argomento-card:disabled:hover {
    transform: none;
    box-shadow: none;
  }

  .argomento-nome {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
  }

  .argomento-meta {
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* Esercizio: matematica */

  .math-card {
    background: #fff;
    border: 1px solid var(--parchment-alt);
    border-radius: 20px;
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    margin-bottom: 20px;
  }

  .colonna {
    font-family: 'Fraunces', serif;
    font-size: 34px;
    font-weight: 600;
    color: var(--ink);
    text-align: right;
    min-width: 140px;
  }

  .colonna-numero { padding: 2px 0; }

  .colonna-con-operatore { position: relative; }

  .colonna-con-operatore .operatore {
    position: absolute;
    left: -32px;
    color: var(--gold);
  }

  .colonna-linea {
    border-top: 3px solid var(--forest);
    margin-top: 6px;
  }

  .colonna .risposta-input {
    width: 100%;
    text-align: right;
    margin-top: 10px;
  }

  .riga-equazione {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .riga-equazione .operatore { color: var(--gold); }

  .risposta-input {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    width: 84px;
    text-align: center;
    padding: 8px 4px;
    border: 2px solid var(--parchment-alt);
    border-radius: 12px;
    color: var(--forest);
    background: var(--parchment);
  }

  .risposta-input:focus {
    outline: 3px solid var(--gold);
    outline-offset: 1px;
    border-color: var(--gold);
  }

  .aiuto-toggle {
    background: none;
    border: none;
    color: var(--dusk);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    padding: 6px 4px;
    margin-bottom: 8px;
  }

  .aiuto-toggle:hover { text-decoration: underline; }

  .aiuto-toggle:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .aiuto-box {
    background: var(--parchment-alt);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .aiuto-testo {
    margin: 0 0 10px;
  }

  .aiuto-ascolta {
    background: var(--dusk);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 7px 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .aiuto-ascolta:hover { opacity: 0.9; }

  .aiuto-ascolta:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .esercizio-feedback {
    font-size: 18px;
    font-weight: 700;
    min-height: 24px;
    text-align: center;
    margin: 0 0 16px;
  }

  .feedback-ok { color: var(--forest-light); }
  .feedback-no { color: var(--red); }

  .esercizio-azioni { display: flex; justify-content: center; }

  .btn-primario {
    background: var(--forest);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 28px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }

  .btn-primario:hover { background: var(--forest-light); }
  .btn-primario:active { transform: scale(0.97); }

  .btn-primario:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .btn-primario:disabled { opacity: 0.5; cursor: default; }

  /* Esercizio: lettura sillabe */

  .lettura-card {
    background: #fff;
    border: 1px solid var(--parchment-alt);
    border-radius: 20px;
    padding: 44px 28px;
    text-align: center;
    margin-bottom: 20px;
  }

  .lettura-istruzione {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 22px;
  }

  .lettura-sillaba {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 64px;
    color: var(--forest);
    letter-spacing: 0.02em;
  }

  .esercizio-azioni-doppie {
    display: flex;
    gap: 14px;
    justify-content: center;
  }

  .btn-esito {
    flex: 1;
    max-width: 200px;
    border: none;
    border-radius: 14px;
    padding: 16px 18px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .btn-esito:active { transform: scale(0.96); }

  .btn-esito:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .btn-esito-si { background: var(--forest); color: #fff; }
  .btn-esito-no { background: var(--parchment-alt); color: var(--ink); }

  #status {
    margin-top: 40px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .status-ok { color: var(--forest-light); }
  .status-err { color: var(--red); }

  /* Laboratorio parole (lettoscrittura) */

  .lab-intro {
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.5;
    margin: -12px 0 22px;
  }

  .lab-gioco-icona { font-size: 22px; margin-right: 6px; }

  .lab-genitori {
    margin-top: 34px;
    padding-top: 22px;
    border-top: 2px dashed var(--parchment-alt);
  }

  .lab-chip-gruppo { margin-bottom: 16px; }

  .lab-chip-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .lab-chips { display: flex; flex-wrap: wrap; gap: 8px; }

  .lab-chip {
    background: #fff;
    border: 2px solid var(--parchment-alt);
    border-radius: 999px;
    padding: 8px 16px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    cursor: pointer;
  }

  .lab-chip.attiva {
    background: var(--forest);
    border-color: var(--forest);
    color: #fff;
  }

  .lab-chip:focus-visible,
  .lab-opzione:focus-visible,
  .lab-tessera:focus-visible,
  .lab-slot:focus-visible,
  .lab-ascolta:focus-visible,
  .lab-mini:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .lab-progresso {
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    margin: -14px 0 10px;
  }

  .lab-card {
    background: #fff;
    border: 1px solid var(--parchment-alt);
    border-radius: 20px;
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 18px;
  }

  .lab-istruzione {
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.45;
    margin: 0 0 16px;
  }

  .lab-font,
  .lab-parola,
  .lab-opzione,
  .lab-tessera,
  .lab-slot,
  .lab-lettera,
  .lab-lampo {
    font-family: 'Andika', 'Nunito', sans-serif;
  }

  .lab-ascolta {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: none;
    background: var(--dusk);
    color: #fff;
    font-size: 30px;
    cursor: pointer;
    margin: 0 auto 14px;
    display: block;
    box-shadow: 0 4px 0 #46557f;
  }

  .lab-ascolta:active { transform: translateY(2px); box-shadow: 0 2px 0 #46557f; }

  .lab-emoji { font-size: 54px; line-height: 1.2; margin-bottom: 6px; }
  .lab-orecchio { font-size: 40px; opacity: 0.6; }

  .lab-etichetta {
    display: inline-block;
    background: var(--parchment-alt);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 13px;
    font-weight: 800;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .lab-parola {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ink);
    line-height: 1.3;
    word-break: break-word;
  }

  .lab-buco {
    display: inline-block;
    min-width: 0.75em;
    border-bottom: 5px solid var(--gold);
    margin: 0 3px;
  }

  .lab-vocale-trovata {
    border-bottom: 5px solid var(--forest-light);
  }

  .lab-doppia {
    background: #FCE9B8;
    border-radius: 6px;
    box-shadow: inset 0 -4px 0 var(--gold);
  }

  .lab-sep {
    color: var(--gold);
    margin: 0 0.12em;
  }

  .lab-lettera {
    font-size: 96px;
    font-weight: 700;
    color: var(--forest);
    line-height: 1.1;
  }

  .lab-lettera small {
    font-size: 96px;
    color: var(--dusk);
    margin-left: 0.25em;
  }

  .lab-opzioni {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 22px;
  }

  .lab-opzione {
    min-width: 84px;
    background: var(--parchment);
    border: 3px solid var(--parchment-alt);
    border-radius: 16px;
    padding: 10px 18px;
    font-size: 40px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: transform 0.1s ease;
  }

  .lab-opzione:active { transform: scale(0.96); }
  .lab-opzione-parola { font-size: 32px; flex: 1 1 40%; }
  .lab-opzione.giusta { background: #E3F0E7; border-color: var(--forest-light); }
  .lab-opzione.sbagliata { background: #F7E1DC; border-color: var(--red); opacity: 0.75; }
  .lab-opzione:disabled { cursor: default; color: var(--ink); }

  .lab-slots {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 18px 0 8px;
  }

  .lab-slot {
    min-width: 76px;
    min-height: 62px;
    border: 3px dashed var(--gold);
    border-radius: 14px;
    background: var(--parchment);
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
    padding: 6px 10px;
    cursor: pointer;
    letter-spacing: 0.05em;
  }

  .lab-slot.pieno { border-style: solid; background: #fff; }
  .lab-slot.giusta { border-color: var(--forest-light); background: #E3F0E7; }
  .lab-slot.sbagliata { border-color: var(--red); background: #F7E1DC; }

  .lab-tessere {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
  }

  .lab-tessera {
    min-width: 70px;
    background: #fff;
    border: 2px solid var(--forest);
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 4px 0 var(--forest);
    letter-spacing: 0.05em;
  }

  .lab-tessera:disabled { visibility: hidden; }

  .lab-soluzione { margin-top: 14px; }

  .lab-lampo {
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--forest);
  }

  .lab-lampo-vuoto { color: var(--parchment-alt); }

  .lab-righe { text-align: left; margin-top: 8px; }

  .lab-riga {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 10px 0;
    border-bottom: 1px solid var(--parchment-alt);
  }

  .lab-riga:last-child { border-bottom: none; }

  .lab-riga-et {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
  }

  .lab-riga .lab-parola { font-size: 34px; white-space: nowrap; }

  .lab-corsivo {
    font-family: 'Playwrite IT Moderna', cursive;
    font-size: 30px;
    color: var(--ink);
    line-height: 1.8;
  }

  .lab-fine {
    text-align: center;
    padding: 36px 20px;
  }

  .lab-fine-numero {
    font-family: 'Fraunces', serif;
    font-size: 56px;
    font-weight: 700;
    color: var(--forest);
    margin: 0;
  }

  .lab-fine .esercizio-azioni { gap: 12px; flex-wrap: wrap; margin-top: 20px; }

  .btn-secondario {
    background: var(--parchment-alt);
    color: var(--ink);
    border: none;
    border-radius: 14px;
    padding: 14px 24px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
  }

  .lab-reg-gruppo {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--forest);
    margin: 26px 0 10px;
  }

  .lab-reg-riga {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--parchment-alt);
    border-radius: 14px;
    padding: 8px 10px 8px 16px;
    margin-bottom: 8px;
  }

  .lab-reg-parola {
    flex: 1;
    font-family: 'Andika', 'Nunito', sans-serif;
    font-size: 22px;
    font-weight: 700;
  }

  .lab-reg-stato {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    display: block;
    font-family: 'Nunito', sans-serif;
  }

  .lab-reg-stato.ok { color: var(--forest-light); }

  .lab-mini {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: none;
    background: var(--parchment-alt);
    font-size: 20px;
    cursor: pointer;
  }

  .lab-mini.rec { background: var(--red); color: #fff; animation: lab-pulsa 1s infinite; }

  @keyframes lab-pulsa { 50% { opacity: 0.6; } }

  .lab-avviso {
    background: #F7E1DC;
    color: var(--red);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
  }

  @media (max-width: 420px) {
    #greeting-name { font-size: 26px; }
    .wordmark { font-size: 24px; }
    .lettura-sillaba { font-size: 52px; }
    .lab-parola { font-size: 36px; }
    .lab-opzione-parola { font-size: 26px; }
    .lab-lampo { font-size: 52px; }
    .lab-riga .lab-parola { font-size: 28px; }
    .lab-corsivo { font-size: 26px; }
  }
</style>
</head>
<body>
  <main>
    <header>
      <svg class="owl" width="56" height="56" viewBox="0 0 120 120" role="img" aria-label="Gufo Saggio">
        <path d="M28 30 L40 6 L50 32 Z" fill="#2F4B3C"/>
        <path d="M92 30 L80 6 L70 32 Z" fill="#2F4B3C"/>
        <ellipse cx="60" cy="66" rx="46" ry="50" fill="#2F4B3C"/>
        <ellipse cx="60" cy="96" rx="19" ry="15" fill="#4C7160" opacity="0.55"/>
        <circle cx="42" cy="58" r="18" fill="#F7F1E1"/>
        <circle cx="78" cy="58" r="18" fill="#F7F1E1"/>
        <circle cx="42" cy="58" r="8" fill="#C9950F"/>
        <circle cx="78" cy="58" r="8" fill="#C9950F"/>

    // ---------- Esercizio: selezione pesata ----------

    function pesoEsercizio(esercizioId) {
      const tentativi = state.progressi
        .filter(p => p.esercizio_id === esercizioId)
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp))
      if (!tentativi.length) return 2
      const errori = tentativi.filter(t => !t.corretto).length
      const ultimo = tentativi[tentativi.length - 1]
      let peso = 1 + errori * 1.5
      if (ultimo.corretto) peso *= 0.4
      return Math.max(peso, 0.3)
    }

    function pickEsercizio(argomentoId, escludiId) {
      let pool = state.esercizi.filter(e => e.argomento_id === argomentoId)
      if (!pool.length) return null
      if (pool.length > 1 && escludiId) {
        pool = pool.filter(e => e.id !== escludiId)
      }
      const pesi = pool.map(e => pesoEsercizio(e.id))
      const totale = pesi.reduce((a, b) => a + b, 0)
      let r = Math.random() * totale
      for (let i = 0; i < pool.length; i++) {
        r -= pesi[i]
        if (r <= 0) return pool[i]
      }
      return pool[pool.length - 1]
    }

    // ---------- Insegnante virtuale: incoraggiamenti contestuali ----------

    const FRASI_STREAK = [
      'Tre giuste di fila, stai andando alla grande!',
      'Che serie! Continua così.',
      'Sei in un bel momento, vero?'
    ]

    const FRASI_STREAK_LUNGA = [

      'Wow, complimenti, stai andando fortissimo.',
      'Sei inarrestabile oggi!'
    ]

    const FRASI_MIGLIORAMENTO = [
      'Su questo argomento di solito fai più fatica, e oggi ti sta venendo benissimo!',

    const FRASI_DIFFICILE = [

      'Ottimo lavoro, era un esercizio impegnativo.',

    function eDifficile(es) {
      if (es.tipo === 'risposta_libera') return es.contenuto.formato === 'colonna'
      if (es.tipo === 'lettura_supervisionata') return es.contenuto.livello !== 'semplice'

    function tassoErroreStoricoArgomento(argomentoId) {
      const idEserciziArgomento = new Set(
        state.esercizi.filter(e => e.argomento_id === argomentoId).map(e => e.id)
      )
      const tentativi = state.progressi.filter(p => idEserciziArgomento.has(p.esercizio_id))
      if (tentativi.length < 3) return null
      const errori = tentativi.filter(t => !t.corretto).length
      return errori / tentativi.length
    }

    function considerIncoraggiamento(es) {
      // Calcolato PRIMA che il tentativo corrente venga salvato in state.progressi,
      // così riflette lo storico reale e non il tentativo appena fatto.
      const tassoStorico = tassoErroreStoricoArgomento(es.argomento_id)
      const difficile = eDifficile(es)

      state.sessione.streak = (state.sessione.streak || 0) + 1
      const streak = state.sessione.streak

      let probabilita = 0.15
      let categoria = 'generica'

      if (streak >= 5 && streak % 5 === 0) {
        probabilita = 0.9
        categoria = 'streak_lunga'
      } else if (streak >= 3) {
        probabilita = 0.55
        categoria = 'streak'
      }

      if (tassoStorico !== null && tassoStorico >= 0.4) {
        probabilita = Math.max(probabilita, 0.6)
        categoria = 'miglioramento'
      } else if (difficile && categoria === 'generica') {
        probabilita = Math.max(probabilita, 0.35)
        categoria = 'difficile'
      }

      if (Math.random() > probabilita) return

      const frasiPerCategoria = {
        streak_lunga: FRASI_STREAK_LUNGA,
        streak: FRASI_STREAK,
        miglioramento: FRASI_MIGLIORAMENTO,
        difficile: FRASI_DIFFICILE,
        generica: FRASI_GENERICHE
      }
      const frasi = frasiPerCategoria[categoria]
      const frase = frasi[Math.floor(Math.random() * frasi.length)]

      // Ritardo per non accavallarsi alla musichetta dei coriandoli
      setTimeout(() => parla(frase), 1600)
    }

    // ---------- Voce per i consigli ----------

    function parla(testo) {
      fermaVoce()
      parlaLento(testo, 0.85)
    }

    // ---------- Festa per le risposte corrette ----------

    let audioCtx = null

    function getAudioCtx() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext
      if (!AudioCtx) return null
      if (!audioCtx) audioCtx = new AudioCtx()
      if (audioCtx.state === 'suspended') audioCtx.resume()
      return audioCtx
    }

    function playFanfare() {
      try {
        const ctx = getAudioCtx()
        if (!ctx) return
        const note = (freq, start, dur) => {
          const osc = ctx.createOscillator()
          const gain = ctx.createGain()
          osc.type = 'triangle'
          osc.frequency.value = freq
          const t0 = ctx.currentTime + start
          gain.gain.setValueAtTime(0, t0)
          gain.gain.linearRampToValueAtTime(0.28, t0 + 0.02)
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur)
          osc.connect(gain)
          gain.connect(ctx.destination)
          osc.start(t0)
          osc.stop(t0 + dur + 0.05)
        }
        note(392.00, 0,    0.12) // ta
        note(523.25, 0.12, 0.12) // ta
        note(659.25, 0.24, 0.12) // ta
        note(783.99, 0.36, 0.55) // daaa
      } catch (err) {
        console.warn('Gufo Saggio – audio non disponibile:', err)
      }
    }

    function creaConfetti() {
      const durata = 1500
      const canvas = document.createElement('canvas')
      canvas.style.position = 'fixed'
      canvas.style.inset = '0'
      canvas.style.zIndex = '999'
      canvas.style.pointerEvents = 'none'
      canvas.width = window.innerWidth
      canvas.height = window.innerHeight
      document.body.appendChild(canvas)
      const ctx = canvas.getContext('2d')

      const colori = ['#C9950F', '#2F4B3C', '#5B6C9E', '#D2555A', '#E8963C', '#4FA3C9']
      const pezzi = Array.from({ length: 140 }, () => ({
        x: canvas.width / 2 + (Math.random() - 0.5) * 80,
        y: canvas.height * 0.35 + (Math.random() - 0.5) * 40,
        vx: (Math.random() - 0.5) * 10,
        vy: -Math.random() * 9 - 4,
        size: 5 + Math.random() * 5,
        colore: colori[Math.floor(Math.random() * colori.length)],
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.3
      }))

      const inizio = performance.now()
      const gravita = 0.28

      function frame(now) {
        const t = now - inizio
        ctx.clearRect(0, 0, canvas.width, canvas.height)
        for (const p of pezzi) {
          p.vy += gravita
          p.x += p.vx
          p.y += p.vy
          p.rot += p.vrot
          ctx.save()
          ctx.translate(p.x, p.y)
          ctx.rotate(p.rot)
          ctx.fillStyle = p.colore
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6)
          ctx.restore()
        }
        if (t < durata) {
          requestAnimationFrame(frame)
        } else {
          canvas.remove()
        }
      }
      requestAnimationFrame(frame)

      return durata
    }

    function festeggia() {
      playFanfare()
      const durata = creaConfetti()
      return new Promise((resolve) => setTimeout(resolve, durata))
    }

    // ---------- Salvataggio progressi ----------

    async function salvaProgresso(esercizioId, rispostaData, corretto) {
      const record = {
        figlio_id: state.figlio?.id,
        esercizio_id: esercizioId,
        risposta_data: rispostaData,
        corretto
      }
      if (!supabase) return
      const { data, error } = await supabase.from('progressi_studente').insert(record).select()
      if (error) {
        console.error('Gufo Saggio – errore salvataggio progresso:', error)
        return
      }
      if (data && data[0]) state.progressi.push(data[0])
    }

    // =====================================================================
    // ---------- Laboratorio parole (lettoscrittura) ----------
    // Giochi per: maiuscole/minuscole, vocali a-e-o, suoni simili, doppie,
    // lettura veloce di sillabe, costruzione di parole, dettato su quaderno.
    // Funziona senza database: preferenze e progressi restano sul dispositivo
    // (localStorage), le registrazioni vocali in IndexedDB.

    const VOCALI = 'aeiou'

    let labSessione = null

    function leggiJSON(key, def) {
      try {
        const v = JSON.parse(localStorage.getItem(key))
        return v ?? def
      } catch { return def }
    }

    function scriviJSON(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)) } catch {}
    }

    const labPrefs = Object.assign(
      { maiuscolo: true, vocaliColorate: true, velocitaLampo: 1500, livelloLampo: 1 },
      leggiJSON('gufo-lab-prefs', {})
    )
    const salvaPrefs = () => scriviJSON('gufo-lab-prefs', labPrefs)

    const labStats = leggiJSON('gufo-lab-stats', {})

    function registraEsito(gioco, chiave, corretto) {
      const s = labStats[gioco] || (labStats[gioco] = { ok: 0, tot: 0, errori: {} })
      s.tot++
      if (corretto) {
        s.ok++
        if (s.errori[chiave]) s.errori[chiave] = Math.max(0, s.errori[chiave] - 0.5)
      } else {
        s.errori[chiave] = (s.errori[chiave] || 0) + 1
      }
      scriviJSON('gufo-lab-stats', labStats)
    }

    const caso = (arr) => arr[Math.floor(Math.random() * arr.length)]

    function mescola(arr) {
      const a = [...arr]
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]]
      }
      return a
    }

    // Le parole sbagliate tornano più spesso, senza ripetere subito l'ultima
    function pescaPesata(gioco, items, chiave) {
      const errori = labStats[gioco]?.errori || {}
      const ultimo = labSessione?.ultimo
      const pool = items.length > 1 ? items.filter(it => chiave(it) !== ultimo) : items
      const pesi = pool.map(it => 1 + (errori[chiave(it)] || 0) * 2)
      let r = Math.random() * pesi.reduce((a, b) => a + b, 0)
      for (let i = 0; i < pool.length; i++) {
        r -= pesi[i]
        if (r <= 0) return pool[i]
      }
      return pool[pool.length - 1]
    }

    const COLORI_VOCALI = { a: '#D2555A', e: '#2E8B57', o: '#3F6FC4', i: '#D9822B', u: '#8A5BB5' }

    // Rende una parola rispettando maiuscolo/minuscolo e vocali colorate.
    // Con doppie: true evidenzia le consonanti doppie; il trattino diventa separatore di sillaba.
    function scrivi(parola, opzioni = {}) {
      const {
        doppie = false,
        colori = labPrefs.vocaliColorate,
        maiuscolo = labPrefs.maiuscolo
      } = opzioni
      const caratteri = [...parola]
      const lettere = caratteri.map((ch, i) => ({ ch: ch.toLowerCase(), i })).filter(x => x.ch !== '-')
      const doppia = new Set()
      if (doppie) {
        for (let k = 1; k < lettere.length; k++) {
          const a = lettere[k - 1].ch, b = lettere[k].ch
          if (a === b && /[a-z]/.test(a) && !VOCALI.includes(a)) {
            doppia.add(lettere[k - 1].i)
            doppia.add(lettere[k].i)
          }
        }
      }
      let html = ''
      caratteri.forEach((ch, i) => {
        if (ch === '-') { html += '<span class="lab-sep">·</span>'; return }
        const low = ch.toLowerCase()
        const testo = maiuscolo ? ch.toUpperCase() : low
        const stile = colori && COLORI_VOCALI[low] ? ` style="color:${COLORI_VOCALI[low]}"` : ''
        const classe = doppia.has(i) ? ' class="lab-doppia"' : ''
        html += (stile || classe) ? `<span${classe}${stile}>${testo}</span>` : testo
      })
      return html
    }

    // ---------- Voce: registrazioni dei genitori o sintesi vocale ----------

    let dbVocePromise = null

    function apriDbVoce() {
      if (!dbVocePromise) {
        dbVocePromise = new Promise((resolve, reject) => {
          const req = indexedDB.open('gufo-voce', 1)
          req.onupgradeneeded = () => req.result.createObjectStore('registrazioni')
          req.onsuccess = () => resolve(req.result)
          req.onerror = () => reject(req.error)
        })
      }
      return dbVocePromise
    }

    async function dbVoce(modo, azione) {
      try {
        const db = await apriDbVoce()
        return await new Promise((resolve) => {
          const store = db.transaction('registrazioni', modo).objectStore('registrazioni')
          const req = azione(store)
          req.onsuccess = () => resolve(req.result ?? null)
          req.onerror = () => resolve(null)
        })
      } catch (err) {
        console.warn('Gufo Saggio – archivio voce non disponibile:', err)
        return null
      }
    }

    const voceGet = (parola) => dbVoce('readonly', s => s.get(parola))
    const voceChiavi = async () => (await dbVoce('readonly', s => s.getAllKeys())) || []

    // Le registrazioni sono tenute pronte in memoria: su iPhone l'audio parte
    // solo se avviato subito dal tocco, senza attese.
    const voceInMemoria = new Map()

    async function caricaVoci() {
      for (const parola of await voceChiavi()) {
        const blob = await voceGet(parola)
        if (blob) voceInMemoria.set(parola, URL.createObjectURL(blob))
      }
    }

    async function voceSet(parola, blob) {
      await dbVoce('readwrite', s => s.put(blob, parola))
      if (voceInMemoria.has(parola)) URL.revokeObjectURL(voceInMemoria.get(parola))
      voceInMemoria.set(parola, URL.createObjectURL(blob))
    }

    async function voceDel(parola) {
      await dbVoce('readwrite', s => s.delete(parola))
      if (voceInMemoria.has(parola)) URL.revokeObjectURL(voceInMemoria.get(parola))
      voceInMemoria.delete(parola)
    }

    let audioCorrente = null

    function fermaVoce() {
      try {
        const sintesi = window.speechSynthesis
        if (sintesi && (sintesi.speaking || sintesi.pending)) sintesi.cancel()
      } catch {}
      if (audioCorrente) {
        audioCorrente.pause()
        audioCorrente = null
      }
    }

    function voceItaliana() {
      try {
        const voci = window.speechSynthesis.getVoices()
        return voci.find(v => v.lang === 'it-IT' && v.localService) || voci.find(v => v.lang?.startsWith('it')) || null
      } catch { return null }
    }

    function parlaLento(testo, velocita = 0.7) {
      try {
        if (!('speechSynthesis' in window)) return
        const u = new SpeechSynthesisUtterance(testo)
        u.lang = 'it-IT'
        const voce = voceItaliana()
        if (voce) u.voice = voce
        u.rate = velocita
        u.pitch = 1
        window.speechSynthesis.speak(u)
      } catch (err) {
        console.warn('Gufo Saggio – sintesi vocale non disponibile:', err)
      }
    }

    function pronuncia(parola) {
      fermaVoce()
      const url = voceInMemoria.get(parola)
      if (url) {
        const audio = new Audio(url)
        audioCorrente = audio
        audio.play().catch(() => parlaLento(parola))
        return
      }
      parlaLento(parola)
    }

    // Su iPhone la voce va "sbloccata" con un primo tocco: lo facciamo al primo tocco sulla pagina
    let voceSbloccata = false
    function sbloccaVoce() {
      if (voceSbloccata) return
      voceSbloccata = true
      try {
        const u = new SpeechSynthesisUtterance(' ')
        u.volume = 0
        window.speechSynthesis?.speak(u)
      } catch {}
      getAudioCtx()
    }
    document.addEventListener('pointerdown', sbloccaVoce, { capture: true })
    document.addEventListener('touchend', sbloccaVoce, { capture: true })

    // ---------- Registrazione ----------

    let streamMicrofono = null
    let registrazioneAttiva = null

    async function prendiMicrofono() {
      if (streamMicrofono && streamMicrofono.getTracks().some(t => t.readyState === 'live')) return streamMicrofono
      streamMicrofono = await navigator.mediaDevices.getUserMedia({ audio: true })
      return streamMicrofono
    }

    function rilasciaMicrofono() {
      if (streamMicrofono) {
        streamMicrofono.getTracks().forEach(t => t.stop())
        streamMicrofono = null
      }
    }

    function fermaRegistrazione() {
      const r = registrazioneAttiva
      if (!r) return
      clearTimeout(r.timer)
      if (r.recorder.state !== 'inactive') r.recorder.stop()
    }

    async function avviaRegistrazione(parola, alTermine) {
      fermaRegistrazione()
      fermaVoce()
      const stream = await prendiMicrofono()
      const recorder = new MediaRecorder(stream)
      const pezzi = []
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) pezzi.push(e.data) }
      recorder.onstop = async () => {
        registrazioneAttiva = null
        const blob = new Blob(pezzi, { type: recorder.mimeType || 'audio/webm' })
        if (blob.size) await voceSet(parola, blob)
        alTermine?.()
      }
      recorder.start()
      // Stop automatico dopo 4 secondi, nel caso ci si dimentichi
      registrazioneAttiva = { recorder, parola, timer: setTimeout(fermaRegistrazione, 4000) }
    }

    // ---------- Motore dei turni ----------

    function avviaGioco(id) {
      labSessione = { gioco: id, fatti: 0, giusti: 0, ultimo: null, turno: 0 }
      prossimoTurno()
    }

    function prossimoTurno() {
      const s = labSessione
      if (!s) return
      fermaVoce()
      s.turno++
      const g = LAB_GIOCHI[s.gioco]
      const body = $('#lab-body')
      body.innerHTML = ''
      body.append(intestazione(g.icona, g.nome))
      if (s.fatti >= TURNI_PER_ROUND) return renderFineRound(body)
      body.append(el('p', 'lab-progresso', `${s.fatti + 1} di ${TURNI_PER_ROUND}`))
      g.render(body)
    }

    function chiudiTurno({ chiave, ok, fb, az, ripeti }) {
      const s = labSessione
      if (!s) return
      const turno = s.turno
      registraEsito(s.gioco, chiave, ok)
      s.fatti++
      s.ultimo = chiave
      az.innerHTML = ''
      if (ok) {
        s.giusti++
        festeggia()
        fb.textContent = caso(FRASI_BRAVO)
        fb.className = 'esercizio-feedback feedback-ok'
        setTimeout(() => {
          if (labSessione === s && s.turno === turno) prossimoTurno()
        }, 1900)
      } else {
        fb.textContent = caso(FRASI_RIPROVA)
        fb.className = 'esercizio-feedback feedback-no'
        if (ripeti) setTimeout(() => pronuncia(ripeti), 500)
        const avanti = el('button', 'btn-primario', 'Avanti →')
        avanti.addEventListener('click', prossimoTurno)
        az.append(avanti)
      }
    }

    function renderFineRound(body) {
      const s = labSessione
      const box = el('div', 'lab-card lab-fine')
      const frase = s.giusti >= 8
        ? 'Fantastico! Il gufo è fiero di te.'
        : s.giusti >= 5
          ? 'Bravo! Ogni giro ti rende più forte.'
          : 'Bravo che ti sei allenato! Le cose difficili diventano facili un giro alla volta.'
      box.innerHTML = `
        <p class="lab-fine-numero">${s.giusti} / ${TURNI_PER_ROUND}</p>
        <p class="lab-istruzione"></p>
      `
      box.querySelector('.lab-istruzione').textContent = frase
      const az = el('div', 'esercizio-azioni')
      const ancora = el('button', 'btn-primario', 'Ancora un giro')
      ancora.addEventListener('click', () => avviaGioco(s.gioco))
      const fine = el('button', 'btn-secondario', 'Basta per oggi')
      fine.addEventListener('click', () => { location.hash = '#lab' })
      az.append(ancora, fine)
      box.append(az)
      body.append(box)
      if (s.giusti >= 5) festeggia()
      setTimeout(() => parla(frase), 600)
    }

    // Gioco a scelta: un pulsante giusto tra alcune opzioni
    function renderScelta(container, cfg) {
      const card = el('div', 'lab-card')
      card.append(el('p', 'lab-istruzione', cfg.istruzione))
      if (cfg.ascolta) {
        const btnAscolta = el('button', 'lab-ascolta', '🔊')
        btnAscolta.setAttribute('aria-label', 'Ascolta la parola')
        btnAscolta.addEventListener('click', () => pronuncia(cfg.ascolta))
        card.append(btnAscolta)
      }
      const stimolo = el('div', 'lab-stimolo', cfg.stimolo || '')
      card.append(stimolo)

      const opz = el('div', 'lab-opzioni')
      for (const o of cfg.opzioni) {
        const b = el('button', 'lab-opzione' + (cfg.classeOpzione ? ' ' + cfg.classeOpzione : ''), o.html)
        b.dataset.valore = o.valore
        opz.append(b)
      }
      card.append(opz)

      const fb = el('p', 'esercizio-feedback')
      const az = el('div', 'esercizio-azioni')
      container.append(card, fb, az)

      let risposto = false
      opz.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        if (risposto) return
        risposto = true
        const ok = b.dataset.valore === cfg.giusta
        opz.querySelectorAll('button').forEach(x => {
          x.disabled = true
          if (x.dataset.valore === cfg.giusta) x.classList.add('giusta')
        })
        if (!ok) b.classList.add('sbagliata')
        if (cfg.dopo) stimolo.innerHTML = cfg.dopo
        chiudiTurno({ chiave: cfg.chiave, ok, fb, az, ripeti: cfg.ascolta })
      }))

      if (cfg.ascolta) setTimeout(() => pronuncia(cfg.ascolta), 350)
    }

    // ---------- Gioco 1: lettere grandi e piccole ----------

    function renderPonte(c) {
      const [grande, piccola, scelte] = pescaPesata('ponte', LAB_PONTE, it => it[0])
      renderScelta(c, {
        istruzione: 'Questa è una lettera GRANDE. Qual è la sua lettera piccola?',
        stimolo: `<div class="lab-lettera">${grande}</div>`,
        opzioni: mescola(scelte).map(v => ({ valore: v, html: v })),
        giusta: piccola,
        chiave: grande,
        dopo: `<div class="lab-lettera">${grande}<small>${piccola}</small></div>`
      })
    }

    // ---------- Gioco 2: a, e oppure o ----------

    function renderVocali(c) {
      const [marcata, emoji] = pescaPesata('vocali', LAB_VOCALI, it => it[0])
      const idx = marcata.indexOf('[')
      const vocale = marcata[idx + 1]
      const parola = marcata.replace(/[\[\]]/g, '')
      const prima = parola.slice(0, idx)
      const resto = parola.slice(idx + 1)
      const scelte = ['a', 'e', 'o']
      if (!scelte.includes(vocale)) scelte.push(vocale)
      renderScelta(c, {
        istruzione: 'Ascolta la parola. Quale vocale manca?',
        ascolta: parola,
        stimolo: `<div class="lab-emoji">${emoji}</div><div class="lab-parola">${scrivi(prima)}<span class="lab-buco">&nbsp;</span>${scrivi(resto)}</div>`,
        opzioni: scelte.map(v => ({ valore: v, html: scrivi(v) })),
        giusta: vocale,
        chiave: marcata,
        dopo: `<div class="lab-emoji">${emoji}</div><div class="lab-parola">${scrivi(prima)}<span class="lab-vocale-trovata">${scrivi(vocale)}</span>${scrivi(resto)}</div>`
      })
    }

    // ---------- Giochi 3 e 4: suoni gemelli e doppie ----------

    function renderCoppia(c, gioco, lista, istruzione, conEtichetta) {
      const coppia = pescaPesata(gioco, lista, it => it[0] + '/' + it[2])
      const secondo = Math.random() < 0.5
      const target = secondo ? coppia[2] : coppia[0]
      const emoji = secondo ? coppia[3] : coppia[1]
      const etichetta = conEtichetta ? `<p class="lab-etichetta">${coppia[4]}</p>` : ''
      renderScelta(c, {
        istruzione,
        ascolta: target,
        stimolo: `${etichetta}<div class="lab-orecchio">👂</div>`,
        opzioni: [coppia[0], coppia[2]].map(w => ({ valore: w, html: scrivi(w, { doppie: gioco === 'doppie' }) })),
        classeOpzione: 'lab-opzione-parola',
        giusta: target,
        chiave: coppia[0] + '/' + coppia[2],
        dopo: `<div class="lab-emoji">${emoji}</div><div class="lab-parola">${scrivi(target, { doppie: true })}</div>`
      })
    }

    function renderGemelli(c) {
      renderCoppia(c, 'gemelli', LAB_GEMELLI, 'Ascolta bene. Quale parola hai sentito?', true)
    }

    function renderDoppie(c) {
      renderCoppia(c, 'doppie', LAB_DOPPIE, 'Ascolta bene: la doppia si sente più lunga e più forte. Quale parola hai sentito?', false)
    }

    // ---------- Gioco 5: sillabe lampo (con un adulto) ----------

    function renderLampo(c) {
      const controlli = el('div')
      controlli.append(gruppoChip('Cosa leggere', [
        { v: 1, label: 'Sillabe facili' },
        { v: 2, label: 'Sillabe difficili' },
        { v: 3, label: 'Parole' }
      ], labPrefs.livelloLampo, (v) => { labPrefs.livelloLampo = v; salvaPrefs(); prossimoTurno() }))
      controlli.append(gruppoChip('Velocità', [
        { v: 2500, label: '🐢 Lento' },
        { v: 1500, label: '🐇 Medio' },
        { v: 800, label: '⚡ Veloce' }
      ], labPrefs.velocitaLampo, (v) => { labPrefs.velocitaLampo = v; salvaPrefs(); prossimoTurno() }))

      const lista = LAMPO_LIVELLI[labPrefs.livelloLampo] || LAMPO_LIVELLI[1]
      const item = pescaPesata('lampo', lista, it => it)

      const card = el('div', 'lab-card')
      card.append(el('p', 'lab-istruzione', 'Tocca VIA: appare per un attimo, leggilo ad alta voce! Il grande poi tocca com\'è andata.'))
      const lampo = el('div', 'lab-lampo lab-lampo-vuoto', '•••')
      card.append(lampo)

      const fb = el('p', 'esercizio-feedback')
      const az = el('div', 'esercizio-azioni-doppie')
      const via = el('button', 'btn-primario', 'VIA!')
      az.append(via)
      c.append(controlli, card, fb, az)

      const mostra = () => {
        lampo.className = 'lab-lampo'
        lampo.innerHTML = scrivi(item)
        setTimeout(() => {
          lampo.className = 'lab-lampo lab-lampo-vuoto'
          lampo.textContent = '?'
        }, labPrefs.velocitaLampo)
      }

      via.addEventListener('click', () => {
        mostra()
        az.innerHTML = ''
        const rivedi = el('button', 'btn-esito btn-esito-no', '👀 Rivedi')
        const no = el('button', 'btn-esito btn-esito-no', '✗ Da ripetere')
        const si = el('button', 'btn-esito btn-esito-si', '✓ Giusto')
        rivedi.addEventListener('click', mostra)
        az.append(rivedi, no, si)
        const esito = (ok) => {
          lampo.className = 'lab-lampo'
          lampo.innerHTML = scrivi(item)
          const azFinali = el('div', 'esercizio-azioni')
          az.replaceWith(azFinali)
          chiudiTurno({ chiave: item, ok, fb, az: azFinali, ripeti: labPrefs.livelloLampo === 3 ? item : null })
        }
        si.addEventListener('click', () => esito(true))
        no.addEventListener('click', () => esito(false))
      })
    }

    // ---------- Gioco 6: costruisci la parola ----------

    // Pezzi "trappola": la stessa sillaba con o senza doppia (gat → ga, ca → cas)
    function distrattori(sillabe) {
      const trappole = []
      for (let i = 0; i < sillabe.length - 1; i++) {
        const s = sillabe[i], n = sillabe[i + 1]
        const ultima = s[s.length - 1]
        if (!VOCALI.includes(ultima) && n[0] === ultima) trappole.push(s.slice(0, -1))
        else if (VOCALI.includes(ultima) && !VOCALI.includes(n[0])) trappole.push(s + n[0])
      }
      const out = []
      const valide = trappole.filter(t => !sillabe.includes(t))
      if (valide.length) out.push(caso(valide))
      const altre = LAB_PAROLE.flatMap(([w]) => w.split('-')).filter(x => !sillabe.includes(x) && !out.includes(x))
      out.push(caso(altre))
      return out
    }

    function renderCostruisci(c) {
      const [conTrattini, emoji] = pescaPesata('costruisci', LAB_PAROLE, it => it[0])
      const sillabe = conTrattini.split('-')
      const parola = sillabe.join('')
      const tessere = mescola([...sillabe, ...distrattori(sillabe)]).map((t, id) => ({ id, t }))
      const posti = Array(sillabe.length).fill(null)
      let finito = false

      const card = el('div', 'lab-card')
      card.append(el('p', 'lab-istruzione', 'Ascolta la parola e costruiscila con i pezzi giusti. Attento: c\'è qualche pezzo in più!'))
      const btnAscolta = el('button', 'lab-ascolta', '🔊')
      btnAscolta.setAttribute('aria-label', 'Ascolta la parola')
      btnAscolta.addEventListener('click', () => pronuncia(parola))
      card.append(btnAscolta, el('div', 'lab-emoji', emoji))

      const slotBox = el('div', 'lab-slots')
      const tesBox = el('div', 'lab-tessere')
      const soluzione = el('div', 'lab-soluzione')
      card.append(slotBox, tesBox, soluzione)

      const fb = el('p', 'esercizio-feedback')
      const az = el('div', 'esercizio-azioni')
      c.append(card, fb, az)

      function disegna() {
        slotBox.innerHTML = ''
        posti.forEach((idTessera, i) => {
          const tessera = tessere.find(t => t.id === idTessera)
          const s = el('button', 'lab-slot' + (tessera ? ' pieno' : ''), tessera ? scrivi(tessera.t) : '')
          s.setAttribute('aria-label', tessera ? `Togli ${tessera.t}` : `Posto ${i + 1} vuoto`)
          s.addEventListener('click', () => {
            if (finito || idTessera === null) return
            posti[i] = null
            disegna()
          })
          slotBox.append(s)
        })
        tesBox.innerHTML = ''
        for (const t of tessere) {
          const b = el('button', 'lab-tessera', scrivi(t.t))
          b.disabled = posti.includes(t.id) || finito
          b.addEventListener('click', () => {
            const libero = posti.indexOf(null)
            if (libero === -1 || finito) return
            posti[libero] = t.id
            disegna()
            if (!posti.includes(null)) verifica()
          })
          tesBox.append(b)
        }
      }

      function verifica() {
        finito = true
        const composte = posti.map(id => tessere.find(t => t.id === id).t)
        const ok = composte.join('') === parola
        slotBox.querySelectorAll('.lab-slot').forEach((s, i) => {
          s.classList.add(composte[i] === sillabe[i] ? 'giusta' : 'sbagliata')
        })
        tesBox.innerHTML = ''
        soluzione.innerHTML = `<div class="lab-parola">${scrivi(conTrattini, { doppie: true })}</div>`
        chiudiTurno({ chiave: conTrattini, ok, fb, az, ripeti: parola })
      }

      disegna()
      setTimeout(() => pronuncia(parola), 350)
    }

    // ---------- Gioco 7: dettato sul quaderno ----------

    function renderDettato(c) {
      const [conTrattini, emoji] = pescaPesata('dettato', LAB_PAROLE, it => it[0])
      const parola = conTrattini.replace(/-/g, '')

      const card = el('div', 'lab-card')
      card.append(el('p', 'lab-istruzione', 'Ascolta la parola e scrivila sul quaderno, in corsivo. Puoi riascoltarla quante volte vuoi.'))
      const btnAscolta = el('button', 'lab-ascolta', '🔊')
      btnAscolta.setAttribute('aria-label', 'Ascolta la parola')
      btnAscolta.addEventListener('click', () => pronuncia(parola))
      card.append(btnAscolta, el('div', 'lab-emoji', emoji))
      const righe = el('div', 'lab-righe')
      card.append(righe)

      const fb = el('p', 'esercizio-feedback')
      const az = el('div', 'esercizio-azioni')
      const controlla = el('button', 'btn-primario', 'Ho scritto: controlla ✓')
      az.append(controlla)
      c.append(card, fb, az)

      controlla.addEventListener('click', () => {
        righe.innerHTML = `
          <div class="lab-riga"><span class="lab-riga-et">Stampato grande</span><span class="lab-parola">${scrivi(parola, { doppie: true, maiuscolo: true, colori: false })}</span></div>
          <div class="lab-riga"><span class="lab-riga-et">Stampato piccolo</span><span class="lab-parola">${scrivi(parola, { doppie: true, maiuscolo: false, colori: false })}</span></div>
          <div class="lab-riga"><span class="lab-riga-et">Corsivo</span><span class="lab-corsivo">${parola}</span></div>
          <div class="lab-riga"><span class="lab-riga-et">Sillabe</span><span class="lab-parola">${scrivi(conTrattini, { doppie: true })}</span></div>
        `
        fb.textContent = 'Confronta con il tuo quaderno, lettera per lettera.'
        fb.className = 'esercizio-feedback'
        const box = el('div', 'esercizio-azioni-doppie')
        const no = el('button', 'btn-esito btn-esito-no', '✗ C\'era un errore')
        const si = el('button', 'btn-esito btn-esito-si', '✓ Scritto giusto')
        box.append(no, si)
        az.replaceWith(box)
        const esito = (ok) => {
          const azFinali = el('div', 'esercizio-azioni')
          box.replaceWith(azFinali)
          chiudiTurno({ chiave: conTrattini, ok, fb, az: azFinali, ripeti: parola })
        }
        si.addEventListener('click', () => esito(true))
        no.addEventListener('click', () => esito(false))
      })

      setTimeout(() => pronuncia(parola), 350)
    }

    // ---------- Registra la tua voce ----------

    async function renderRegistra() {
      const body = $('#lab-body')
      body.innerHTML = ''
      body.append(intestazione('🎙️', 'Registra la tua voce'))
      body.append(el('p', 'lab-intro',
        'Tocca 🎙️, di\' la parola chiaramente (le doppie belle lunghe: pal-la!) e tocca ⏹️. Si ferma da sola dopo 4 secondi. ' +
        'Le parole senza registrazione le legge la voce del telefono. Le registrazioni restano solo su questo dispositivo.'))

      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        body.append(el('div', 'lab-avviso', 'Questo browser non permette di registrare. Prova con Chrome o Safari aggiornati.'))
        return
      }

      const registrate = new Set(await voceChiavi())
      const avviso = el('div')
      body.append(avviso)

      const gruppi = [
        ['Doppie', LAB_DOPPIE.flatMap(d => [d[0], d[2]])],
        ['Suoni gemelli', LAB_GEMELLI.flatMap(g => [g[0], g[2]])],
        ['Parole del dettato', LAB_PAROLE.map(([w]) => w.replace(/-/g, ''))]
      ]
      const giaMostrate = new Set()

      for (const [titolo, parole] of gruppi) {
        const uniche = parole.filter(p => !giaMostrate.has(p))
        uniche.forEach(p => giaMostrate.add(p))
        if (!uniche.length) continue
        const quante = uniche.filter(p => registrate.has(p)).length
        const h = el('h3', 'lab-reg-gruppo')
        h.textContent = `${titolo} · ${quante} su ${uniche.length}`
        body.append(h)
        for (const p of uniche) body.append(rigaRegistrazione(p, registrate, avviso))
      }
    }

    function rigaRegistrazione(parola, registrate, avviso) {
      const riga = el('div', 'lab-reg-riga')
      const ha = registrate.has(parola)
      riga.innerHTML = `
        <span class="lab-reg-parola">${parola}<span class="lab-reg-stato${ha ? ' ok' : ''}">${ha ? '✓ la tua voce' : 'voce del telefono'}</span></span>
      `
      const play = el('button', 'lab-mini', '▶️')
      play.setAttribute('aria-label', `Ascolta ${parola}`)
      play.addEventListener('click', () => pronuncia(parola))

      const rec = el('button', 'lab-mini', '🎙️')
      rec.setAttribute('aria-label', `Registra ${parola}`)
      rec.addEventListener('click', async () => {
        if (registrazioneAttiva?.parola === parola) { fermaRegistrazione(); return }
        try {
          avviso.innerHTML = ''
          document.querySelectorAll('.lab-mini.rec').forEach(b => { b.classList.remove('rec'); b.textContent = '🎙️' })
          rec.classList.add('rec')
          rec.textContent = '⏹️'
          await avviaRegistrazione(parola, () => {
            registrate.add(parola)
            riga.replaceWith(rigaRegistrazione(parola, registrate, avviso))
            pronuncia(parola)
          })
        } catch (err) {
          console.warn('Gufo Saggio – microfono non disponibile:', err)
          rec.classList.remove('rec')
          rec.textContent = '🎙️'
          avviso.innerHTML = '<div class="lab-avviso">Non riesco a usare il microfono. Controlla di avergli dato il permesso nelle impostazioni del browser.</div>'
        }
      })

      riga.append(play, rec)

      if (ha) {
        const del = el('button', 'lab-mini', '🗑️')
        del.setAttribute('aria-label', `Cancella la registrazione di ${parola}`)
        del.addEventListener('click', async () => {
          await voceDel(parola)
          registrate.delete(parola)
          riga.replaceWith(rigaRegistrazione(parola, registrate, avviso))
        })
        riga.append(del)
      }
      return riga
    }

    // ---------- Router ----------

    function router() {
      const hashArgomento = location.hash.match(/^#argomento\/(.+)$/)
      const hashMateria = location.hash.match(/^#materia\/(.+)$/)
      const hashLab = location.hash.match(/^#lab(?:\/(.+))?$/)

      // Uscendo da una schermata del laboratorio si ferma tutto ciò che è in corso
      labSessione = null
      fermaVoce()
      fermaRegistrazione()
      if (!hashLab || hashLab[1] !== 'registra') rilasciaMicrofono()

      if (hashLab) {
        showView('view-lab')
        renderLab(hashLab[1])
      } else if (hashArgomento) {
        showView('view-esercizio')
        avviaEsercizio(hashArgomento[1])
      } else if (hashMateria) {
        showView('view-argomenti')
        renderArgomenti(hashMateria[1])
      } else {
        showView('view-home')
      }
    }

    $('#back-link').addEventListener('click', (e) => {
      e.preventDefault()
      location.hash = ''
    })

    $('#back-link-lab').addEventListener('click', (e) => {
      e.preventDefault()
      location.hash = e.currentTarget.dataset.target || ''
    })

    $('#back-link-esercizio').addEventListener('click', (e) => {
      e.preventDefault()
      location.hash = e.currentTarget.dataset.target || ''
    })

    window.addEventListener('hashchange', router)

    // ---------- Stato connessione ----------

    function renderError() {
      $('#greeting-name').textContent = 'Il gufo è confuso'
      $('#greeting-meta').textContent = 'Non riesco a collegarmi al database, quindi le materie non si vedono. Il Laboratorio parole funziona lo stesso.'
    }

    function setStatus(ok, err) {
      const el = $('#status')
      el.textContent = ok ? 'Connesso a Supabase ✓' : `Connessione non riuscita${err?.message ? ' (' + err.message + ')' : ''}`
      el.classList.toggle('status-ok', ok)
      el.classList.toggle('status-err', !ok)
    }

    // ---------- Init ----------

    async function init() {
      // Il Laboratorio parole è disponibile subito, anche prima del database
      caricaVoci()
      renderMaterie()
      router()
      try {
        if (!supabase) {
          const lib = await conTimeout(import(SUPABASE_LIB), 12000, 'Caricamento libreria database')
          supabase = lib.createClient(SUPABASE_URL, SUPABASE_KEY)
        }
        const [
          { data: figli, error: e1 },
          { data: materie, error: e2 },
          { data: argomenti, error: e3 },
          { data: esercizi, error: e4 },
          { data: progressi, error: e5 }
        ] = await conTimeout(Promise.all([
          supabase.from('figli').select('*').order('created_at', { ascending: true }).limit(1),
          supabase.from('materie').select('*').order('ordine', { ascending: true }),
          supabase.from('argomenti').select('*'),
          supabase.from('esercizi').select('*'),
          supabase.from('progressi_studente').select('*')
        ]), 12000, 'Risposta del database')

        if (e1) throw e1
        if (e2) throw e2
        if (e3) throw e3
        if (e4) throw e4
        if (e5) throw e5

        state.figlio = figli?.[0] || null
        state.materie = materie || []
        state.argomenti = argomenti || []
        state.esercizi = esercizi || []
        state.progressi = progressi || []

        state.eserciziCount = new Map()
        for (const e of state.esercizi) {
          state.eserciziCount.set(e.argomento_id, (state.eserciziCount.get(e.argomento_id) || 0) + 1)
        }

        renderGreeting()
        renderMaterie()
        router()
        setStatus(true)
      } catch (err) {
        console.error('Gufo Saggio – errore di connessione:', err)
        renderError()
        renderMaterie()
        router()
        setStatus(false, err)
      }
    }
