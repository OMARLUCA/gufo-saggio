<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gufo Saggio</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #F7F1E1;
    --parchment-alt: #EFE4C8;
    --ink: #2C2416;
    --ink-soft: #6B5E48;
    --forest: #2F4B3C;
    --forest-light: #4C7160;
    --gold: #C9950F;
    --dusk: #5B6C9E;
    --red: #A8432D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    background: var(--parchment);
    background-image:
      radial-gradient(circle at 15% 8%, var(--parchment-alt) 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, var(--parchment-alt) 0%, transparent 40%);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 48px;
  }

  main {
    width: 100%;
    max-width: 560px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 36px;
  }

  header .owl { flex-shrink: 0; }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    color: var(--forest);
    line-height: 1.1;
  }

  .tagline {
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .greeting-card {
    background: #fff;
    border: 1px solid var(--parchment-alt);
    border-radius: 20px;
    padding: 28px 26px;
    box-shadow: 0 4px 0 var(--parchment-alt);
    margin-bottom: 40px;
  }

  #greeting-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    color: var(--forest);
    margin: 0 0 6px;
  }

  #greeting-meta {
    font-size: 16px;
    color: var(--ink-soft);
    margin: 0;
  }

  .section-label {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--forest);
    margin: 0 0 16px;
  }

  #materie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }

  .materia-card {
    background: #fff;
    border: 1px solid var(--parchment-alt);
    border-radius: 18px;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    font: inherit;
    cursor: pointer;
    width: 100%;
    text-align: left;
  }

  .materia-card:hover,
  .materia-card:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(47, 75, 60, 0.12);
  }

  .materia-card:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .materia-icona {
    font-size: 34px;
    line-height: 1;
  }

  .materia-nome {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    color: var(--ink);
  }

  .materia-tag {
    font-size: 13px;
    color: var(--dusk);
    font-weight: 700;
  }

  .empty {
    color: var(--ink-soft);
    font-size: 15px;
  }

  #view-argomenti[hidden],
  #view-home[hidden],
  #view-esercizio[hidden] {
    display: none;
  }

  .back-link {
    display: inline-block;
    color: var(--forest);
    font-weight: 700;
    text-decoration: none;
    margin-bottom: 24px;
    font-size: 15px;
    cursor: pointer;
  }

  .back-link:hover { text-decoration: underline; }

  .back-link:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .argomenti-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .argomenti-header-icona { font-size: 32px; }

  .argomenti-header-nome {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    color: var(--forest);
    margin: 0;
  }

  .argomento-card {
    background: #fff;
    border: 1px solid var(--parchment-alt);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
    width: 100%;
    text-align: left;
    font: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .argomento-card:hover,
  .argomento-card:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(47, 75, 60, 0.1);
  }

  .argomento-card:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .argomento-card:disabled {
    cursor: default;
    opacity: 0.6;
  }

  .argomento-card:disabled:hover {
    transform: none;
    box-shadow: none;
  }

  .argomento-nome {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
  }

  .argomento-meta {
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* Esercizio: matematica */

  .math-card {
    background: #fff;
    border: 1px solid var(--parchment-alt);
    border-radius: 20px;
    padding: 36px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    margin-bottom: 20px;
  }

  .colonna {
    font-family: 'Fraunces', serif;
    font-size: 34px;
    font-weight: 600;
    color: var(--ink);
    text-align: right;
    min-width: 140px;
  }

  .colonna-numero { padding: 2px 0; }

  .colonna-con-operatore { position: relative; }

  .colonna-con-operatore .operatore {
    position: absolute;
    left: -32px;
    color: var(--gold);
  }

  .colonna-linea {
    border-top: 3px solid var(--forest);
    margin-top: 6px;
  }

  .colonna .risposta-input {
    width: 100%;
    text-align: right;
    margin-top: 10px;
  }

  .riga-equazione {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .riga-equazione .operatore { color: var(--gold); }

  .risposta-input {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 600;
    width: 84px;
    text-align: center;
    padding: 8px 4px;
    border: 2px solid var(--parchment-alt);
    border-radius: 12px;
    color: var(--forest);
    background: var(--parchment);
  }

  .risposta-input:focus {
    outline: 3px solid var(--gold);
    outline-offset: 1px;
    border-color: var(--gold);
  }

  .aiuto-toggle {
    background: none;
    border: none;
    color: var(--dusk);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    padding: 6px 4px;
    margin-bottom: 8px;
  }

  .aiuto-toggle:hover { text-decoration: underline; }

  .aiuto-toggle:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .aiuto-box {
    background: var(--parchment-alt);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .aiuto-testo {
    margin: 0 0 10px;
  }

  .aiuto-ascolta {
    background: var(--dusk);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 7px 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .aiuto-ascolta:hover { opacity: 0.9; }

  .aiuto-ascolta:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .esercizio-feedback {
    font-size: 18px;
    font-weight: 700;
    min-height: 24px;
    text-align: center;
    margin: 0 0 16px;
  }

  .feedback-ok { color: var(--forest-light); }
  .feedback-no { color: var(--red); }

  .esercizio-azioni { display: flex; justify-content: center; }

  .btn-primario {
    background: var(--forest);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 28px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }

  .btn-primario:hover { background: var(--forest-light); }
  .btn-primario:active { transform: scale(0.97); }

  .btn-primario:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .btn-primario:disabled { opacity: 0.5; cursor: default; }

  /* Esercizio: lettura sillabe */

  .lettura-card {
    background: #fff;
    border: 1px solid var(--parchment-alt);
    border-radius: 20px;
    padding: 44px 28px;
    text-align: center;
    margin-bottom: 20px;
  }

  .lettura-istruzione {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 22px;
  }

  .lettura-sillaba {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 64px;
    color: var(--forest);
    letter-spacing: 0.02em;
  }

  .esercizio-azioni-doppie {
    display: flex;
    gap: 14px;
    justify-content: center;
  }

  .btn-esito {
    flex: 1;
    max-width: 200px;
    border: none;
    border-radius: 14px;
    padding: 16px 18px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .btn-esito:active { transform: scale(0.96); }

  .btn-esito:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  .btn-esito-si { background: var(--forest); color: #fff; }
  .btn-esito-no { background: var(--parchment-alt); color: var(--ink); }

  #status {
    margin-top: 40px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  .status-ok { color: var(--forest-light); }
  .status-err { color: var(--red); }

  @media (max-width: 420px) {
    #greeting-name { font-size: 26px; }
    .wordmark { font-size: 24px; }
    .lettura-sillaba { font-size: 52px; }
  }
</style>
</head>
<body>
  <main>
    <header>
      <svg class="owl" width="56" height="56" viewBox="0 0 120 120" role="img" aria-label="Gufo Saggio">
        <path d="M28 30 L40 6 L50 32 Z" fill="#2F4B3C"/>
        <path d="M92 30 L80 6 L70 32 Z" fill="#2F4B3C"/>
        <ellipse cx="60" cy="66" rx="46" ry="50" fill="#2F4B3C"/>
        <ellipse cx="60" cy="96" rx="19" ry="15" fill="#4C7160" opacity="0.55"/>
        <circle cx="42" cy="58" r="18" fill="#F7F1E1"/>
        <circle cx="78" cy="58" r="18" fill="#F7F1E1"/>
        <circle cx="42" cy="58" r="8" fill="#C9950F"/>
        <circle cx="78" cy="58" r="8" fill="#C9950F"/>
        <circle cx="42" cy="58" r="3" fill="#2C2416"/>
        <circle cx="78" cy="58" r="3" fill="#2C2416"/>
        <path d="M60 68 L54 78 L66 78 Z" fill="#C9950F"/>
      </svg>
      <div>
        <div class="wordmark">Gufo Saggio</div>
        <div class="tagline">Il tuo compagno di studio</div>
      </div>
    </header>

    <section id="view-home">
      <section class="greeting-card">
        <p id="greeting-name">Sveglio il gufo…</p>
        <p id="greeting-meta">Un attimo, mi sto collegando.</p>
      </section>

      <section>
        <h2 class="section-label">Le tue materie</h2>
        <div id="materie-grid"></div>
      </section>
    </section>

    <section id="view-argomenti" hidden>
      <a href="#" id="back-link" class="back-link">← Torna alle materie</a>
      <div class="argomenti-header">
        <span id="argomenti-header-icona" class="argomenti-header-icona"></span>
        <h2 id="argomenti-header-nome" class="argomenti-header-nome"></h2>
      </div>
      <h3 class="section-label">Argomenti</h3>
      <div id="argomenti-list"></div>
    </section>

    <section id="view-esercizio" hidden>
      <a href="#" id="back-link-esercizio" class="back-link">← Torna agli argomenti</a>
      <div class="argomenti-header">
        <span id="esercizio-header-icona" class="argomenti-header-icona"></span>
        <h2 id="esercizio-header-nome" class="argomenti-header-nome"></h2>
      </div>
      <div id="esercizio-body"></div>
    </section>

    <p id="status"></p>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const supabase = createClient(
      'https://esxpbkablktffswrhhhk.supabase.co',
      'sb_publishable_7osbXOLGJTs7P7F3Un95zg_JBXOpVbD'
    )

    const $ = (sel) => document.querySelector(sel)

    const NOMI_CLASSE = [
      '', '1ª elementare', '2ª elementare', '3ª elementare', '4ª elementare',
      '5ª elementare', '1ª media', '2ª media', '3ª media'
    ]

    function nomeClasse(n) {
      return NOMI_CLASSE[n] || `Classe ${n}`
    }

    const VIEW_IDS = ['view-home', 'view-argomenti', 'view-esercizio']

    function showView(id) {
      for (const v of VIEW_IDS) {
        $('#' + v).hidden = (v !== id)
      }
    }

    const state = {
      figlio: null,
      materie: [],
      argomenti: [],
      esercizi: [],
      progressi: [],
      eserciziCount: new Map(),
      sessione: { argomentoId: null, esercizioCorrente: null, ultimoEsercizioId: null, streak: 0 }
    }

    // ---------- Home ----------

    function renderGreeting() {
      const figlio = state.figlio
      if (!figlio) {
        $('#greeting-name').textContent = 'Ciao!'
        $('#greeting-meta').textContent = 'Nessun profilo trovato ancora nel database.'
        return
      }
      $('#greeting-name').textContent = `Ciao, ${figlio.nome}!`
      $('#greeting-meta').textContent = `${nomeClasse(figlio.classe)} · ${figlio.anno_scolastico}`
    }

    function renderMaterie() {
      const grid = $('#materie-grid')
      grid.innerHTML = ''
      if (!state.materie.length) {
        grid.innerHTML = '<p class="empty">Nessuna materia impostata ancora.</p>'
        return
      }
      for (const m of state.materie) {
        const card = document.createElement('button')
        card.type = 'button'
        card.className = 'materia-card'
        card.innerHTML = `
          <span class="materia-icona">${m.icona || '📚'}</span>
          <span class="materia-nome">${m.nome}</span>
          <span class="materia-tag">Vedi argomenti →</span>
        `
        card.addEventListener('click', () => { location.hash = `#materia/${m.id}` })
        grid.appendChild(card)
      }
    }

    // ---------- Argomenti ----------

    function renderArgomenti(materiaId) {
      const materia = state.materie.find(m => m.id === materiaId)
      if (!materia) { location.hash = ''; return }

      $('#argomenti-header-icona').textContent = materia.icona || '📚'
      $('#argomenti-header-nome').textContent = materia.nome

      const list = $('#argomenti-list')
      list.innerHTML = ''

      const argomentiMateria = state.argomenti
        .filter(a => a.materia_id === materiaId)
        .filter(a => !state.figlio || a.classe_riferimento === state.figlio.classe)

      if (!argomentiMateria.length) {
        list.innerHTML = '<p class="empty">Nessun argomento ancora per questa materia.</p>'
        return
      }

      for (const a of argomentiMateria) {
        const count = state.eserciziCount.get(a.id) || 0
        const disabilitato = count === 0
        const item = document.createElement('button')
        item.type = 'button'
        item.className = 'argomento-card'
        item.disabled = disabilitato
        item.innerHTML = `
          <span class="argomento-nome">${a.nome}</span>
          <span class="argomento-meta">${count} ${count === 1 ? 'esercizio' : 'esercizi'}${disabilitato ? '' : ' · Inizia →'}</span>
        `
        if (!disabilitato) {
          item.addEventListener('click', () => { location.hash = `#argomento/${a.id}` })
        }
        list.appendChild(item)
      }
    }

    // ---------- Esercizio: selezione pesata ----------

    function pesoEsercizio(esercizioId) {
      const tentativi = state.progressi
        .filter(p => p.esercizio_id === esercizioId)
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp))
      if (!tentativi.length) return 2
      const errori = tentativi.filter(t => !t.corretto).length
      const ultimo = tentativi[tentativi.length - 1]
      let peso = 1 + errori * 1.5
      if (ultimo.corretto) peso *= 0.4
      return Math.max(peso, 0.3)
    }

    function pickEsercizio(argomentoId, escludiId) {
      let pool = state.esercizi.filter(e => e.argomento_id === argomentoId)
      if (!pool.length) return null
      if (pool.length > 1 && escludiId) {
        pool = pool.filter(e => e.id !== escludiId)
      }
      const pesi = pool.map(e => pesoEsercizio(e.id))
      const totale = pesi.reduce((a, b) => a + b, 0)
      let r = Math.random() * totale
      for (let i = 0; i < pool.length; i++) {
        r -= pesi[i]
        if (r <= 0) return pool[i]
      }
      return pool[pool.length - 1]
    }

    // ---------- Esercizio: avvio e render ----------

    function avviaEsercizio(argomentoId) {
      const argomento = state.argomenti.find(a => a.id === argomentoId)
      if (!argomento) { location.hash = ''; return }
      const materia = state.materie.find(m => m.id === argomento.materia_id)

      $('#esercizio-header-icona').textContent = materia?.icona || '📚'
      $('#esercizio-header-nome').textContent = argomento.nome
      $('#back-link-esercizio').dataset.target = materia ? `#materia/${materia.id}` : ''

      state.sessione.argomentoId = argomentoId
      const esercizio = pickEsercizio(argomentoId, state.sessione.ultimoEsercizioId)

      if (!esercizio) {
        $('#esercizio-body').innerHTML = '<p class="empty">Nessun esercizio disponibile per questo argomento.</p>'
        return
      }

      state.sessione.esercizioCorrente = esercizio
      renderEsercizio(esercizio)
    }

    function renderEsercizio(es) {
      const container = $('#esercizio-body')
      container.innerHTML = ''

      if (es.tipo === 'risposta_libera') {
        renderEsercizioMatematica(es, container)
      } else if (es.tipo === 'lettura_supervisionata') {
        renderEsercizioLettura(es, container)
      } else {
        container.innerHTML = '<p class="empty">Tipo di esercizio non ancora supportato.</p>'
      }
    }

    // ---------- Esercizio: matematica ----------

    const AIUTO_TIPS = {
      'Addizioni in riga': 'Parti dal numero più grande e conta in avanti con le dita, oppure scomponi il secondo numero in decine e unità.',
      'Addizioni in colonna': 'Incolonna le unità sotto le unità. Se sommandole superi 9, scrivi l\'unità e ricordati di aggiungere 1 alla colonna delle decine.',
      'Sottrazioni in riga': 'Conta all\'indietro dal numero più grande, oppure pensa: "quanto manca per arrivare da un numero all\'altro?"',
      'Sottrazioni in colonna': 'Se il numero sopra è più piccolo di quello sotto, "prendi in prestito" una decina dalla colonna a sinistra.'
    }

    function renderEsercizioMatematica(es, container) {
      const c = es.contenuto
      const argomento = state.argomenti.find(a => a.id === es.argomento_id)
      const tip = argomento ? AIUTO_TIPS[argomento.nome] : null

      if (tip) {
        const toggle = document.createElement('button')
        toggle.type = 'button'
        toggle.className = 'aiuto-toggle'
        toggle.textContent = '💡 Un aiuto?'

        const box = document.createElement('div')
        box.className = 'aiuto-box'
        box.hidden = true

        const testoTip = document.createElement('p')
        testoTip.className = 'aiuto-testo'
        testoTip.textContent = tip

        const ascoltaBtn = document.createElement('button')
        ascoltaBtn.type = 'button'
        ascoltaBtn.className = 'aiuto-ascolta'
        ascoltaBtn.textContent = '🔊 Ascolta'
        ascoltaBtn.addEventListener('click', () => parla(tip))

        box.append(testoTip, ascoltaBtn)

        toggle.addEventListener('click', () => {
          box.hidden = !box.hidden
          toggle.textContent = box.hidden ? '💡 Un aiuto?' : '💡 Nascondi aiuto'
          if (box.hidden) {
            window.speechSynthesis?.cancel()
          } else {
            parla(tip)
          }
        })

        container.append(toggle, box)
      }

      const wrap = document.createElement('div')
      wrap.className = 'math-card'

      if (c.formato === 'colonna') {
        wrap.innerHTML = `
          <div class="colonna">
            <div class="colonna-numero">${c.operando1}</div>
            <div class="colonna-numero colonna-con-operatore"><span class="operatore">${c.operatore}</span>${c.operando2}</div>
            <div class="colonna-linea"></div>
            <input type="text" inputmode="numeric" pattern="[0-9]*" class="risposta-input" id="risposta-input" placeholder="?" autocomplete="off">
          </div>
        `
      } else {
        wrap.innerHTML = `
          <div class="riga-equazione">
            <span>${c.operando1}</span><span class="operatore">${c.operatore}</span><span>${c.operando2}</span><span>=</span>
            <input type="text" inputmode="numeric" pattern="[0-9]*" class="risposta-input" id="risposta-input" placeholder="?" autocomplete="off">
          </div>
        `
      }

      const feedback = document.createElement('p')
      feedback.id = 'esercizio-feedback'
      feedback.className = 'esercizio-feedback'

      const azioni = document.createElement('div')
      azioni.className = 'esercizio-azioni'
      azioni.innerHTML = `<button type="button" id="btn-correggi" class="btn-primario">Correggi</button>`

      container.append(wrap, feedback, azioni)

      const input = $('#risposta-input')
      input.focus()
      $('#btn-correggi').addEventListener('click', () => correggiMatematica(es))
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') correggiMatematica(es)
      })
    }

    async function correggiMatematica(es) {
      const input = $('#risposta-input')
      const valore = input.value.trim()
      if (valore === '') { input.focus(); return }

      const risposta = Number(valore)
      const corretto = risposta === es.soluzione.risposta

      if (corretto) {
        festeggia()
        considerIncoraggiamento(es)
      } else {
        state.sessione.streak = 0
      }

      await salvaProgresso(es.id, { risposta }, corretto)

      const feedback = $('#esercizio-feedback')
      if (corretto) {
        feedback.textContent = 'Giusto! 🎉'
        feedback.className = 'esercizio-feedback feedback-ok'
      } else {
        feedback.textContent = `Quasi. La risposta giusta era ${es.soluzione.risposta}.`
        feedback.className = 'esercizio-feedback feedback-no'
      }

      input.disabled = true
      const vecchioBtn = $('#btn-correggi')
      const nuovoBtn = document.createElement('button')
      nuovoBtn.type = 'button'
      nuovoBtn.id = 'btn-prossimo'
      nuovoBtn.className = 'btn-primario'
      nuovoBtn.textContent = 'Prossimo esercizio →'
      nuovoBtn.addEventListener('click', () => {
        state.sessione.ultimoEsercizioId = es.id
        avviaEsercizio(state.sessione.argomentoId)
      })
      vecchioBtn.replaceWith(nuovoBtn)
    }

    // ---------- Esercizio: lettura sillabe ----------

    function renderEsercizioLettura(es, container) {
      const wrap = document.createElement('div')
      wrap.className = 'lettura-card'
      wrap.innerHTML = `
        <p class="lettura-istruzione">Fai leggere a Davide questa sillaba ad alta voce, poi tocca cosa è successo</p>
        <div class="lettura-sillaba">${es.contenuto.sillaba}</div>
      `

      const azioni = document.createElement('div')
      azioni.className = 'esercizio-azioni-doppie'
      azioni.innerHTML = `
        <button type="button" id="btn-sbagliato" class="btn-esito btn-esito-no">✗ Da ripetere</button>
        <button type="button" id="btn-giusto" class="btn-esito btn-esito-si">✓ Giusto</button>
      `

      container.append(wrap, azioni)

      $('#btn-giusto').addEventListener('click', () => segnaLettura(es, true))
      $('#btn-sbagliato').addEventListener('click', () => segnaLettura(es, false))
    }

    async function segnaLettura(es, corretto) {
      if (corretto) {
        festeggia()
        considerIncoraggiamento(es)
      } else {
        state.sessione.streak = 0
      }
      await salvaProgresso(es.id, { sillaba: es.contenuto.sillaba }, corretto)
      state.sessione.ultimoEsercizioId = es.id
      avviaEsercizio(state.sessione.argomentoId)
    }

    // ---------- Insegnante virtuale: incoraggiamenti contestuali ----------

    const FRASI_STREAK = [
      'Tre giuste di fila, stai andando alla grande!',
      'Che serie! Continua così.',
      'Sei in un bel momento, vero?'
    ]

    const FRASI_STREAK_LUNGA = [
      'Non ne sbagli una, sei davvero bravo oggi!',
      'Wow, complimenti, stai andando fortissimo.',
      'Sei inarrestabile oggi!'
    ]

    const FRASI_MIGLIORAMENTO = [
      'Su questo argomento di solito fai più fatica, e oggi ti sta venendo benissimo!',
      'Stai migliorando proprio su un argomento che ti mette alla prova.',
      'Questo tipo di esercizio ti dava più filo da torcere, e guarda come lo risolvi ora!'
    ]

    const FRASI_DIFFICILE = [
      'Bravo, questo esercizio non era per niente facile.',
      'Ottimo lavoro, era un esercizio impegnativo.',
      'Molto bene, hai superato una sfida vera.'
    ]

    const FRASI_GENERICHE = [
      'Bravissimo!',
      'Perfetto, vai avanti così.',
      'Ottimo lavoro!',
      'Sei sulla strada giusta.'
    ]

    function eDifficile(es) {
      if (es.tipo === 'risposta_libera') return es.contenuto.formato === 'colonna'
      if (es.tipo === 'lettura_supervisionata') return es.contenuto.livello !== 'semplice'
      return false
    }

    function tassoErroreStoricoArgomento(argomentoId) {
      const idEserciziArgomento = new Set(
        state.esercizi.filter(e => e.argomento_id === argomentoId).map(e => e.id)
      )
      const tentativi = state.progressi.filter(p => idEserciziArgomento.has(p.esercizio_id))
      if (tentativi.length < 3) return null
      const errori = tentativi.filter(t => !t.corretto).length
      return errori / tentativi.length
    }

    function considerIncoraggiamento(es) {
      // Calcolato PRIMA che il tentativo corrente venga salvato in state.progressi,
      // così riflette lo storico reale e non il tentativo appena fatto.
      const tassoStorico = tassoErroreStoricoArgomento(es.argomento_id)
      const difficile = eDifficile(es)

      state.sessione.streak = (state.sessione.streak || 0) + 1
      const streak = state.sessione.streak

      let probabilita = 0.15
      let categoria = 'generica'

      if (streak >= 5 && streak % 5 === 0) {
        probabilita = 0.9
        categoria = 'streak_lunga'
      } else if (streak >= 3) {
        probabilita = 0.55
        categoria = 'streak'
      }

      if (tassoStorico !== null && tassoStorico >= 0.4) {
        probabilita = Math.max(probabilita, 0.6)
        categoria = 'miglioramento'
      } else if (difficile && categoria === 'generica') {
        probabilita = Math.max(probabilita, 0.35)
        categoria = 'difficile'
      }

      if (Math.random() > probabilita) return

      const frasiPerCategoria = {
        streak_lunga: FRASI_STREAK_LUNGA,
        streak: FRASI_STREAK,
        miglioramento: FRASI_MIGLIORAMENTO,
        difficile: FRASI_DIFFICILE,
        generica: FRASI_GENERICHE
      }
      const frasi = frasiPerCategoria[categoria]
      const frase = frasi[Math.floor(Math.random() * frasi.length)]

      // Ritardo per non accavallarsi alla musichetta dei coriandoli
      setTimeout(() => parla(frase), 1600)
    }

    // ---------- Voce per i consigli ----------

    function parla(testo) {
      try {
        if (!('speechSynthesis' in window)) return
        window.speechSynthesis.cancel()
        const utterance = new SpeechSynthesisUtterance(testo)
        utterance.lang = 'it-IT'
        utterance.rate = 0.85
        utterance.pitch = 0.95
        utterance.volume = 1
        window.speechSynthesis.speak(utterance)
      } catch (err) {
        console.warn('Gufo Saggio – sintesi vocale non disponibile:', err)
      }
    }

    // ---------- Festa per le risposte corrette ----------

    let audioCtx = null

    function getAudioCtx() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext
      if (!AudioCtx) return null
      if (!audioCtx) audioCtx = new AudioCtx()
      if (audioCtx.state === 'suspended') audioCtx.resume()
      return audioCtx
    }

    function playFanfare() {
      try {
        const ctx = getAudioCtx()
        if (!ctx) return
        const note = (freq, start, dur) => {
          const osc = ctx.createOscillator()
          const gain = ctx.createGain()
          osc.type = 'triangle'
          osc.frequency.value = freq
          const t0 = ctx.currentTime + start
          gain.gain.setValueAtTime(0, t0)
          gain.gain.linearRampToValueAtTime(0.28, t0 + 0.02)
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur)
          osc.connect(gain)
          gain.connect(ctx.destination)
          osc.start(t0)
          osc.stop(t0 + dur + 0.05)
        }
        note(392.00, 0,    0.12) // ta
        note(523.25, 0.12, 0.12) // ta
        note(659.25, 0.24, 0.12) // ta
        note(783.99, 0.36, 0.55) // daaa
      } catch (err) {
        console.warn('Gufo Saggio – audio non disponibile:', err)
      }
    }

    function creaConfetti() {
      const durata = 1500
      const canvas = document.createElement('canvas')
      canvas.style.position = 'fixed'
      canvas.style.inset = '0'
      canvas.style.zIndex = '999'
      canvas.style.pointerEvents = 'none'
      canvas.width = window.innerWidth
      canvas.height = window.innerHeight
      document.body.appendChild(canvas)
      const ctx = canvas.getContext('2d')

      const colori = ['#C9950F', '#2F4B3C', '#5B6C9E', '#D2555A', '#E8963C', '#4FA3C9']
      const pezzi = Array.from({ length: 140 }, () => ({
        x: canvas.width / 2 + (Math.random() - 0.5) * 80,
        y: canvas.height * 0.35 + (Math.random() - 0.5) * 40,
        vx: (Math.random() - 0.5) * 10,
        vy: -Math.random() * 9 - 4,
        size: 5 + Math.random() * 5,
        colore: colori[Math.floor(Math.random() * colori.length)],
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.3
      }))

      const inizio = performance.now()
      const gravita = 0.28

      function frame(now) {
        const t = now - inizio
        ctx.clearRect(0, 0, canvas.width, canvas.height)
        for (const p of pezzi) {
          p.vy += gravita
          p.x += p.vx
          p.y += p.vy
          p.rot += p.vrot
          ctx.save()
          ctx.translate(p.x, p.y)
          ctx.rotate(p.rot)
          ctx.fillStyle = p.colore
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6)
          ctx.restore()
        }
        if (t < durata) {
          requestAnimationFrame(frame)
        } else {
          canvas.remove()
        }
      }
      requestAnimationFrame(frame)

      return durata
    }

    function festeggia() {
      playFanfare()
      const durata = creaConfetti()
      return new Promise((resolve) => setTimeout(resolve, durata))
    }

    // ---------- Salvataggio progressi ----------

    async function salvaProgresso(esercizioId, rispostaData, corretto) {
      const record = {
        figlio_id: state.figlio?.id,
        esercizio_id: esercizioId,
        risposta_data: rispostaData,
        corretto
      }
      const { data, error } = await supabase.from('progressi_studente').insert(record).select()
      if (error) {
        console.error('Gufo Saggio – errore salvataggio progresso:', error)
        return
      }
      if (data && data[0]) state.progressi.push(data[0])
    }

    // ---------- Router ----------

    function router() {
      const hashArgomento = location.hash.match(/^#argomento\/(.+)$/)
      const hashMateria = location.hash.match(/^#materia\/(.+)$/)
      if (hashArgomento) {
        showView('view-esercizio')
        avviaEsercizio(hashArgomento[1])
      } else if (hashMateria) {
        showView('view-argomenti')
        renderArgomenti(hashMateria[1])
      } else {
        showView('view-home')
      }
    }

    $('#back-link').addEventListener('click', (e) => {
      e.preventDefault()
      location.hash = ''
    })

    $('#back-link-esercizio').addEventListener('click', (e) => {
      e.preventDefault()
      location.hash = e.currentTarget.dataset.target || ''
    })

    window.addEventListener('hashchange', router)

    // ---------- Stato connessione ----------

    function renderError() {
      $('#greeting-name').textContent = 'Il gufo è confuso'
      $('#greeting-meta').textContent = 'Non riesco a collegarmi al database. Controlla la connessione e riprova.'
    }

    function setStatus(ok) {
      const el = $('#status')
      el.textContent = ok ? 'Connesso a Supabase ✓' : 'Connessione non riuscita'
      el.classList.toggle('status-ok', ok)
      el.classList.toggle('status-err', !ok)
    }

    // ---------- Init ----------

    async function init() {
      try {
        const [
          { data: figli, error: e1 },
          { data: materie, error: e2 },
          { data: argomenti, error: e3 },
          { data: esercizi, error: e4 },
          { data: progressi, error: e5 }
        ] = await Promise.all([
          supabase.from('figli').select('*').order('created_at', { ascending: true }).limit(1),
          supabase.from('materie').select('*').order('ordine', { ascending: true }),
          supabase.from('argomenti').select('*'),
          supabase.from('esercizi').select('*'),
          supabase.from('progressi_studente').select('*')
        ])

        if (e1) throw e1
        if (e2) throw e2
        if (e3) throw e3
        if (e4) throw e4
        if (e5) throw e5

        state.figlio = figli?.[0] || null
        state.materie = materie || []
        state.argomenti = argomenti || []
        state.esercizi = esercizi || []
        state.progressi = progressi || []

        state.eserciziCount = new Map()
        for (const e of state.esercizi) {
          state.eserciziCount.set(e.argomento_id, (state.eserciziCount.get(e.argomento_id) || 0) + 1)
        }

        renderGreeting()
        renderMaterie()
        router()
        setStatus(true)
      } catch (err) {
        console.error('Gufo Saggio – errore di connessione:', err)
        renderError()
        setStatus(false)
      }
    }

    init()
  </script>
</body>
